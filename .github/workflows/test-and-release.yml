name: Test and Release

env:
  # Keep in sync with .changeset/config.json:baseBranch
  MAIN_REF: refs/heads/main

on:
  push:
    branches: ["**"]

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Publish to npm with OIDC
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  test-and-release:
    name: Test and Release
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
        # Wait until postgres is ready before test steps run.
        # See https://docs.github.com/en/actions/using-containerized-services/creating-postgresql-service-containers
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.11.4

      # for npx publish
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Typecheck package
        run: bun run types

      - name: Pack package
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          PACKAGE_TARBALL="$(npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/package")"
          echo "PACKAGE_TARBALL=$RUNNER_TEMP/package/$PACKAGE_TARBALL" >> "$GITHUB_ENV"

      - name: Setup minimum Node
        uses: actions/setup-node@v7
        with:
          node-version: 18.18.0

      - name: Smoke test package on minimum Node with postgres.js 3
        run: |
          mkdir -p "$RUNNER_TEMP/package-smoke-postgres3"
          cd "$RUNNER_TEMP/package-smoke-postgres3"
          npm init --yes
          npm install --ignore-scripts "$PACKAGE_TARBALL" postgres@3
          node -e 'require("pg-advisory-lock").createAdvisoryLockManager("postgres://localhost").close()'
          node --unhandled-rejections=strict --input-type=module -e 'const { createAdvisoryLockManager } = await import("pg-advisory-lock"); await createAdvisoryLockManager("postgres://localhost").close()'

      # postgres.js 4 is ESM-only, and require() loads ESM starting with Node.js 20.19.
      - name: Setup minimum Node for postgres.js 4
        uses: actions/setup-node@v7
        with:
          node-version: 20.19.0

      - name: Smoke test package on minimum Node with postgres.js 4
        run: |
          mkdir -p "$RUNNER_TEMP/package-smoke-postgres4"
          cd "$RUNNER_TEMP/package-smoke-postgres4"
          npm init --yes
          npm install --ignore-scripts "$PACKAGE_TARBALL" postgres@4
          node -e 'require("pg-advisory-lock").createAdvisoryLockManager("postgres://localhost").close()'
          node --unhandled-rejections=strict --input-type=module -e 'const { createAdvisoryLockManager } = await import("pg-advisory-lock"); await createAdvisoryLockManager("postgres://localhost").close()'

      - name: Restore release Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Typecheck package declarations
        run: |
          for SMOKE_DIR in "$RUNNER_TEMP/package-smoke-postgres3" "$RUNNER_TEMP/package-smoke-postgres4"; do
            cp tests/declarations/* "$SMOKE_DIR"
            npm install --prefix "$SMOKE_DIR" --ignore-scripts @types/node
            node_modules/.bin/tsc -p "$SMOKE_DIR"
          done

      - name: Test package
        run: bun run test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost

      - name: Test package with minimum postgres.js 3
        run: |
          bun add --dev --no-save postgres@3.4.0
          bun run types
          bun run test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost

      - name: Restore locked dependencies
        run: bun install --frozen-lockfile

      - name: Capture release version
        if: ${{ github.ref == env.MAIN_REF }}
        run: |
          npx @changesets/cli status --output=release.json
          RELEASE_VERSION="$(jq -r '.releases[0].newVersion // empty' release.json)"
          if [ -z "$RELEASE_VERSION" ]; then
            RELEASE_VERSION="$(jq -r '.version' package.json)"
          fi
          echo "RELEASE=Version $RELEASE_VERSION" >> "$GITHUB_ENV"
          rm release.json

      - name: Create Release Pull Request or Publish to npm
        if: ${{ github.ref == env.MAIN_REF }}
        uses: changesets/action@v2.1.2
        with:
          publish-script: npx changeset publish
          pr-title: ${{ env.RELEASE }}
          commit-message: ${{ env.RELEASE }}
