name: Test and Release

env:
  # Keep in sync with .changeset/config.json:baseBranch
  MAIN_REF: refs/heads/main

on:
  push:
    branches: ["**"]

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Publish to npm with OIDC
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  test-and-release:
    name: Test and Release
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
        # Wait until postgres is ready before test steps run.
        # See https://docs.github.com/en/actions/using-containerized-services/creating-postgresql-service-containers
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          version: 2026.7.15

      # for npx publish
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Pack package
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          PACKAGE_TARBALL="$(npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/package")"
          echo "PACKAGE_TARBALL=$RUNNER_TEMP/package/$PACKAGE_TARBALL" >> "$GITHUB_ENV"

      - name: Setup minimum Node
        uses: actions/setup-node@v6
        with:
          node-version: 18.18.0

      - name: Smoke test package on minimum Node
        run: |
          mkdir -p "$RUNNER_TEMP/package-smoke"
          cd "$RUNNER_TEMP/package-smoke"
          npm init --yes
          npm install --ignore-scripts "$PACKAGE_TARBALL"
          node -e 'require("pg-advisory-lock")'
          node --unhandled-rejections=strict --input-type=module -e 'import("pg-advisory-lock")'

      - name: Restore release Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Test package
        run: bun run test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost

      - name: Capture release version
        if: ${{ github.ref == env.MAIN_REF }}
        run: |
          npx @changesets/cli status --output=release.json
          RELEASE_VERSION="$(jq -r '.releases[0].newVersion // empty' release.json)"
          if [ -z "$RELEASE_VERSION" ]; then
            RELEASE_VERSION="$(jq -r '.version' package.json)"
          fi
          echo "RELEASE=Version $RELEASE_VERSION" >> "$GITHUB_ENV"
          rm release.json

      - name: Create Release Pull Request or Publish to npm
        if: ${{ github.ref == env.MAIN_REF }}
        uses: changesets/action@v1
        with:
          publish: npx changeset publish
          title: ${{ env.RELEASE }}
          commit: ${{ env.RELEASE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
